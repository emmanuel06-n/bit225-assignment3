<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueLib Catalogue | BlueCrest College</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="logo">BlueLib Catalogue</h1>
            <nav aria-label="Main navigation">
                <ul class="nav-list">
                    <li><a href="#catalogue">Catalogue</a></li>
                    <li><a href="#add-book">Add Book</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="catalogue" class="panel">
            <h2>Welcome to the BlueCrest College Library</h2>
            <p class="intro">Search for a book, filter by category and borrow a copy.</p>

            <div class="controls">
                <div class="field">
                    <label for="search-input">Search by title</label>
                    <input type="text" id="search-input" placeholder="e.g. JavaScript">
                </div>
                <div class="field">
                    <label for="category-filter">Category</label>
                    <select id="category-filter">
                        <option value="All">All</option>
                        <option value="IT">IT</option>
                        <option value="Business">Business</option>
                        <option value="Science">Science</option>
                        <option value="Arts">Arts</option>
                    </select>
                </div>
            </div>

            <p id="no-results" class="message" hidden>No books found.</p>
            <div id="book-list" class="book-grid"></div>
        </section>

        <section id="add-book" class="panel">
            <h2>Add a New Book</h2>
            <form id="add-book-form" novalidate>
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title">
                </div>
                <div class="field">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author">
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="">-- Select category --</option>
                        <option value="IT">IT</option>
                        <option value="Business">Business</option>
                        <option value="Science">Science</option>
                        <option value="Arts">Arts</option>
                    </select>
                </div>
                <div class="field">
                    <label for="copies">Copies Available</label>
                    <input type="number" id="copies" name="copies" min="0" step="1">
                </div>
                <button type="submit" class="btn">Add Book</button>
                <p id="form-message" class="message" role="alert"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 BlueLib Catalogue | BIT225 Assignment 2 | EMMANUEL ARTHUR | 400622038986</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
